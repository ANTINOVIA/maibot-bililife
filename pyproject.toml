[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maibot-bililife"
version = "0.2.6"
description = "麦麦的 B 站生活：证据、日程、互动与可追溯记忆"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "vendor/LICENSE"]
authors = [{name = "ANTINOVIA"}]
dependencies = ["maibot-plugin-sdk==2.16.0", "bilibili-api-python==17.4.2", "httpx==0.28.1", "pydantic==2.14.1", "qrcode==8.2", "Pillow>=10", "aiohttp>=3.10,<4"]

[project.urls]
Repository = "https://github.com/ANTINOVIA/maibot-bililife"
Documentation = "https://github.com/ANTINOVIA/maibot-bililife#readme"
Issues = "https://github.com/ANTINOVIA/maibot-bililife/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = []
