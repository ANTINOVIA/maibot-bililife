# MaiBot BiliLife 0.2.6 · 不包含账号凭据或模型密钥
# 可在对应模块的 TOML 编辑器保存，或修改服务器 settings.toml 后重载插件。

# 每日安排
[schedule]
planner_enabled = true
adaptive_schedule_enabled = true
max_dynamic_tasks = 3
schedule_task_minutes = 30
schedule_brief_minutes = 15
schedule_gap_minutes = 30
schedule_rest_minutes = 60
schedule_rest_max_minutes = 180
timezone = "Asia/Shanghai"
plan_time = "09:00"
active_start = "09:00"
active_end = "22:30"
task_timeout_seconds = 300
max_retries = 2

# 浏览与理解
[browse]
browsing_enabled = true
max_videos = 4
max_comment_sessions = 4
max_comments_read = 12
max_video_seconds = 900
max_browse_seconds = 2400
allowed_topics = ["科学", "技术", "日常生活"]
excluded_topics = []
allowed_uploaders = []
video_understanding_mode = "frames"
max_frames = 3
enable_asr = false
segment_seconds = 90
max_download_mb = 40
daily_download_mb = 120

# 视频评论
[comments]
comments_enabled = true
auto_publish_comments = false
comment_prompt = "按麦麦现有的人格和表达习惯，像参与讨论的观众一样说话。围绕已取得资料里的一个具体细节，表达简短的看法、感受或一个确实好奇的问题，通常一两句即可，不必每次都提问。没有具体想说的就不评论。避免助手汇报、学习笔记、总结报告和空泛夸赞，不要用‘我记下了’‘已记录’‘受益匪浅’等套话，不列提纲，不复述整段视频。不刻意堆网络梗、口头禅或假装熟悉作者，不编造亲身经历、身份或完整观看经历。引用与选择依据放在结构化字段里，不写进评论正文；不自动承诺收藏、学习或采取行动。回复先回应对方的具体内容，无新增信息时结束。主人提及由程序添加。"
comment_avoid_phrases = ["我记下了", "我记住了", "已记录", "受益匪浅", "值得深入探讨", "作为AI"]
owner_uid = ""
mention_owner = true
max_comments = 1
max_per_video = 1
cooldown_seconds = 3600

# 回复跟进
[replies]
replies_enabled = true
auto_publish_replies = false
max_replies = 2
max_thread_rounds = 2
user_cooldown_seconds = 21600
reply_interval_seconds = 3600

# 经历与记忆
[memory]
memory_enabled = true
recall_limit = 4
recall_chars = 2400

# 兴趣与人格干预
[persona]
evolution_enabled = true
persona_guidance = ""
expression_preferences = []

# 每日复盘
[review]
review_enabled = true
review_time = "22:00"
summary_stream_id = ""

# 模型与调用预算
[models]
max_model_calls = 24
max_tokens = 70000
output_tokens = 1600
model_timeout_seconds = 100
text_model_task = "utils"
vision_model_task = "vlm"
asr_model_task = "voice"

# 存储与运行维护
[resources]
max_storage_mb = 256
retention_days = 60
cache_hours = 12

# 运行提示词
[prompts]
prompt_overrides = {  }
